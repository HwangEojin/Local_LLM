[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-audit"
version = "0.1.0"
description = "로컬 LLM 기반 모듈형 보안 취약점 진단 워크스테이션"
requires-python = ">=3.12"
dependencies = [
    "mcp==1.27.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "psycopg[binary]==3.2.13",
]

[project.optional-dependencies]
# 웹 UI(findings/runs 로컬 대시보드, README §7 "다음 구현 단계" 10번 이후)만 쓰는 의존성.
# CLI 는 이 없이도 완전히 동작한다.
web = [
    "fastapi==0.147.0",
    "uvicorn[standard]==0.54.0",
    "itsdangerous==2.2.0",
]

[project.scripts]
workbench = "diagnostic_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
